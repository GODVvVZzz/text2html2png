<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src data:; base-uri 'none'; form-action 'none'">
<title>Partial burial</title><style>
*{box-sizing:border-box;margin:0} html,body{background:#fff} body{padding:20px;font-family:Georgia,serif;color:#111}
.wrap{width:700px}
h1{margin-bottom:14px;font-size:22px}
.stack{position:relative;height:60px}
/* text box: y = stack+10 .. stack+34 ; cover: y = stack+4 .. stack+40, x 0..420 of 600 */
.line{position:absolute;left:0;top:10px;width:600px;height:24px;line-height:24px;white-space:nowrap;font-size:16px}
.cover{position:absolute;left:0;top:4px;width:420px;height:36px;background:#111827;border-radius:6px}
</style></head><body>
<main class="wrap" aria-label="Partial burial">
<h1>Partial burial</h1>
<section class="stack">
<p class="line">The migration window opens on 14 March and closes on 21 March.</p>
<div class="cover"></div>
</section>
</main></body></html>
