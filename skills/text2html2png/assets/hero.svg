<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Text2HTML2PNG hero</title>
  <desc id="desc">Turn one text prompt into a polished local-first HTML diagram, with PNG on request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A14"/>
      <stop offset=".55" stop-color="#10162B"/>
      <stop offset="1" stop-color="#1A1034"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#A78BFA"/>
    </marker>
  </defs>
  <rect width="1440" height="760" rx="44" fill="url(#bg)"/>
  <rect width="1440" height="760" rx="44" fill="url(#grid)"/>
  <circle cx="128" cy="82" r="210" fill="#22D3EE" opacity=".08"/>
  <circle cx="1310" cy="690" r="300" fill="#A855F7" opacity=".12"/>

  <g transform="translate(86 70)">
    <rect width="198" height="42" rx="21" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="24" cy="21" r="8" fill="#22D3EE"/>
    <text x="44" y="28" fill="#DCE7FF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="18" font-weight="700">AGENT SKILL</text>
    <text x="0" y="118" fill="#FFFFFF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="74" font-weight="800" letter-spacing="-3">text2html2png</text>
    <text x="0" y="168" fill="#AAB7D4" font-family="Avenir Next, Segoe UI, sans-serif" font-size="29">One prompt. Editable HTML by default. Crisp PNG on request.</text>
  </g>

  <g transform="translate(86 282)" font-family="Avenir Next, Segoe UI, sans-serif" font-size="17" font-weight="700">
    <g><rect width="166" height="46" rx="23" fill="#0EA5E9" fill-opacity=".16" stroke="#38BDF8" stroke-opacity=".5"/><text x="83" y="29" text-anchor="middle" fill="#BAE6FD">8 diagram types</text></g>
    <g transform="translate(180)"><rect width="166" height="46" rx="23" fill="#8B5CF6" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".5"/><text x="83" y="29" text-anchor="middle" fill="#DDD6FE">7 visual themes</text></g>
    <g transform="translate(360)"><rect width="156" height="46" rx="23" fill="#EC4899" fill-opacity=".14" stroke="#F472B6" stroke-opacity=".5"/><text x="78" y="29" text-anchor="middle" fill="#FBCFE8">local-first</text></g>
  </g>

  <g transform="translate(86 380)" filter="url(#shadow)">
    <rect width="430" height="278" rx="26" fill="#11182B" stroke="#31405F"/>
    <rect x="24" y="24" width="112" height="28" rx="14" fill="#22D3EE" fill-opacity=".13"/>
    <text x="80" y="44" text-anchor="middle" fill="#67E8F9" font-family="SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">YOUR PROMPT</text>
    <text x="26" y="91" fill="#F8FAFC" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" font-weight="700">“Show our release flow:</text>
    <text x="26" y="126" fill="#CBD5E1" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">plan → build → review → test</text>
    <text x="26" y="158" fill="#CBD5E1" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">→ canary → production.”</text>
    <path d="M28 205h374" stroke="#334155"/>
    <text x="28" y="238" fill="#94A3B8" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">No API key · No upload · No design tool</text>
  </g>

  <path d="M550 520h112" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="606" y="494" text-anchor="middle" fill="#C4B5FD" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="700">GENERATE</text>

  <g transform="translate(700 350)" filter="url(#shadow)">
    <rect width="654" height="338" rx="30" fill="#FAF6EE"/>
    <text x="327" y="54" text-anchor="middle" fill="#2E2410" font-family="Georgia, Songti SC, serif" font-size="28" font-weight="700">From idea to production</text>
    <text x="327" y="82" text-anchor="middle" fill="#806A4A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="14">A six-stage release workflow</text>
    <g transform="translate(28 112)" font-family="Avenir Next, Segoe UI, sans-serif">
      <g><rect width="178" height="86" rx="14" fill="#FFF" stroke="#E2D8C4"/><rect width="178" height="5" rx="3" fill="#C0622A"/><text x="18" y="38" fill="#2E2410" font-size="17" font-weight="700">01 · Plan</text><text x="18" y="64" fill="#806A4A" font-size="13">Define scope</text></g>
      <g transform="translate(210)"><rect width="178" height="86" rx="14" fill="#FFF" stroke="#E2D8C4"/><rect width="178" height="5" rx="3" fill="#3A7A8C"/><text x="18" y="38" fill="#2E2410" font-size="17" font-weight="700">02 · Build</text><text x="18" y="64" fill="#806A4A" font-size="13">Implement &amp; review</text></g>
      <g transform="translate(420)"><rect width="178" height="86" rx="14" fill="#FFF" stroke="#E2D8C4"/><rect width="178" height="5" rx="3" fill="#6A3A8C"/><text x="18" y="38" fill="#2E2410" font-size="17" font-weight="700">03 · Verify</text><text x="18" y="64" fill="#806A4A" font-size="13">Test safely</text></g>
      <path d="M89 104v18h210v-18M299 122h210v-18" fill="none" stroke="#C0A06A" stroke-width="2"/>
      <g transform="translate(28 148)"><rect width="178" height="70" rx="14" fill="#FFF" stroke="#E2D8C4"/><text x="18" y="34" fill="#2E2410" font-size="17" font-weight="700">04 · Canary</text><text x="18" y="55" fill="#806A4A" font-size="13">Observe</text></g>
      <g transform="translate(238 148)"><rect width="178" height="70" rx="14" fill="#FFF" stroke="#E2D8C4"/><text x="18" y="34" fill="#2E2410" font-size="17" font-weight="700">05 · Approve</text><text x="18" y="55" fill="#806A4A" font-size="13">Confirm signals</text></g>
      <g transform="translate(448 148)"><rect width="150" height="70" rx="14" fill="#4F2F12"/><text x="18" y="34" fill="#FFF8E9" font-size="17" font-weight="700">06 · Ship</text><text x="18" y="55" fill="#F6D7AE" font-size="13">Production</text></g>
    </g>
  </g>
</svg>
