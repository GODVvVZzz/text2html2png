* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--t-canvas);
  background-image: var(--t-canvas-image);
}

body {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  color: var(--t-text);
  font-family: var(--t-font-body);
  font-size: var(--t-body-size);
  font-weight: var(--t-body-weight);
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 1040px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 30px 32px 26px;
  overflow: hidden;
  background: var(--t-surface);
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-card-radius);
  box-shadow: var(--t-card-shadow);
  backdrop-filter: var(--t-backdrop);
  -webkit-backdrop-filter: var(--t-backdrop);
}

.head {
  text-align: center;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--t-accent-1);
  font-family: var(--t-font-data);
  font-size: var(--t-label-size);
  font-weight: var(--t-label-weight);
  letter-spacing: var(--t-label-tracking);
  text-transform: var(--t-label-transform);
}

h1 {
  margin: 0;
  color: var(--t-text);
  font-family: var(--t-font-display);
  font-size: var(--t-title-size);
  font-weight: var(--t-title-weight);
  letter-spacing: var(--t-title-tracking);
  line-height: 1.12;
  text-transform: var(--t-title-transform);
}

.lede {
  max-width: 700px;
  margin: 9px auto 0;
  color: var(--t-text-secondary);
  font-size: var(--t-body-size);
  font-style: var(--t-lede-style);
  line-height: 1.55;
}

.head-rule {
  height: 2px;
  margin-top: 16px;
  background: var(--t-head-rule-image);
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.metric {
  position: relative;
  min-height: 102px;
  padding: 14px 16px 13px;
  overflow: hidden;
  text-align: center;
  background: color-mix(in srgb, var(--metric-accent) 7%, var(--t-surface-strong));
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-small-radius);
  box-shadow: var(--t-card-shadow);
  backdrop-filter: var(--t-backdrop);
  -webkit-backdrop-filter: var(--t-backdrop);
}

.metric:first-child {
  box-shadow: var(--t-highlight-shadow);
}

.metric::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 4px;
  background: var(--metric-accent);
}

.metric-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.metric-emoji {
  display: var(--t-emoji-display);
  align-items: center;
  justify-content: center;
  font-size: 19px;
  line-height: 1;
}

/* Emoji slots render nothing until a fixture supplies a glyph, so an
   emoji-on theme never leaves an empty flex gap behind. */
[class$="-emoji"]:empty {
  display: none;
}

.metric-icon-svg {
  display: var(--t-svg-display);
  width: 19px;
  height: 19px;
}

.metric-icon-svg svg {
  display: block;
  width: 100%;
  height: 100%;
}

.metric-value {
  display: inline-block;
  color: var(--metric-accent);
  font-family: var(--t-font-data);
  font-size: var(--t-data-size);
  font-weight: var(--t-data-weight);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.metric-label {
  display: block;
  margin-top: 8px;
  color: var(--t-text);
  font-size: 12px;
  font-weight: 700;
}

.metric-detail {
  display: block;
  margin-top: 4px;
  color: var(--t-text-muted);
  font-size: 12px;
  line-height: 1.35;
}

html:lang(zh-CN) .eyebrow,
html:lang(zh-CN) .footer-label {
  letter-spacing: 0.08em;
  text-transform: none;
}

html:lang(zh-CN) h1 {
  letter-spacing: 0;
}

.footer {
  display: grid;
  grid-template-columns: 160px 1fr;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  color: var(--t-banner-text);
  background: var(--t-banner-bg);
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-small-radius);
  box-shadow: var(--t-card-shadow);
}

.footer-label {
  color: var(--t-banner-accent);
  font-family: var(--t-font-data);
  font-size: var(--t-label-size);
  font-weight: var(--t-label-weight);
  letter-spacing: var(--t-label-tracking);
  text-transform: var(--t-label-transform);
}

.footer p {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
}

.funnel {
  display: flex;
  flex-direction: column;
}

.funnel-stage {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 64px;
  align-items: center;
  column-gap: 12px;
}

.funnel-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  justify-self: center;
  width: var(--bar-width);
  min-width: 120px;
  padding: 12px 16px;
  background: var(--tone);
  border-radius: var(--t-small-radius);
  box-shadow: var(--t-card-shadow);
}

.funnel-stage-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--t-on-accent);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.3;
}

.funnel-stage-num {
  color: var(--t-on-accent);
  font-family: var(--t-font-data);
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
}

.funnel-meta {
  flex: 0 0 auto;
  min-width: 58px;
}

.funnel-pct {
  color: var(--t-text);
  font-family: var(--t-font-data);
  font-size: 17px;
  font-weight: 800;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.funnel-drop {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  height: 22px;
}

.funnel-drop-text {
  color: var(--t-text-secondary);
  font-family: var(--t-font-data);
  font-size: 11px;
  font-weight: 700;
  line-height: 22px;
  font-variant-numeric: tabular-nums;
}

.funnel-drop-reason {
  color: var(--t-text-muted);
  font-size: 12px;
  line-height: 22px;
}

html:lang(zh-CN) .funnel-drop-reason {
  letter-spacing: 0.04em;
}
  </style>
</head>
<body>
<main class="wrap" aria-label="从落地页到激活">
<header class="head">
<p class="eyebrow">注册漏斗</p>
<h1>从落地页到激活</h1>
<p class="lede">30 天同期群 · 48,200 位访客 → 8,700 人激活 · 合成示例数据</p>
<div class="head-rule"></div>
</header>
<section class="funnel" aria-label="从落地页到激活">
<div class="funnel-stage" style="--tone: var(--t-accent-2); --bar-width: 100%;">
<div class="funnel-bar">
<span class="funnel-stage-name">访问落地页</span>
<span class="funnel-stage-num">48,200</span>
</div>
<div class="funnel-meta"><span class="funnel-pct">100%</span></div>
</div>
<div class="funnel-drop">
<span class="funnel-drop-text">-61%</span>
<span class="funnel-drop-reason">流失 29,405 人</span>
</div>
<div class="funnel-stage" style="--tone: var(--t-accent-4); --bar-width: 38.99%;">
<div class="funnel-bar">
<span class="funnel-stage-name">开始注册</span>
<span class="funnel-stage-num">18,795</span>
</div>
<div class="funnel-meta"><span class="funnel-pct">39%</span></div>
</div>
<div class="funnel-drop">
<span class="funnel-drop-text">-32.7%</span>
<span class="funnel-drop-reason">流失 6,155 人</span>
</div>
<div class="funnel-stage" style="--tone: var(--t-accent-7); --bar-width: 26.22%;">
<div class="funnel-bar">
<span class="funnel-stage-name">完成邮箱验证</span>
<span class="funnel-stage-num">12,640</span>
</div>
<div class="funnel-meta"><span class="funnel-pct">26%</span></div>
</div>
<div class="funnel-drop">
<span class="funnel-drop-text">-29.4%</span>
<span class="funnel-drop-reason">流失 3,710 人</span>
</div>
<div class="funnel-stage" style="--tone: var(--t-accent-3); --bar-width: 18.53%;">
<div class="funnel-bar">
<span class="funnel-stage-name">完善个人资料</span>
<span class="funnel-stage-num">8,930</span>
</div>
<div class="funnel-meta"><span class="funnel-pct">19%</span></div>
</div>
<div class="funnel-drop">
<span class="funnel-drop-text">-2.6%</span>
<span class="funnel-drop-reason">流失 230 人</span>
</div>
<div class="funnel-stage" style="--tone: var(--t-accent-6); --bar-width: 18.05%;">
<div class="funnel-bar">
<span class="funnel-stage-name">完成激活</span>
<span class="funnel-stage-num">8,700</span>
</div>
<div class="funnel-meta"><span class="funnel-pct">18%</span></div>
</div>
</section>
<footer class="footer">
<div class="footer-label">结论</div>
<p>整体转化率 18%——48,200 位访客中 8,700 人完成激活。最大流失环节：落地页到开始注册，流失 29,405 人。</p>
</footer>
</main>
</body>
