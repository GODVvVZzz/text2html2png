  <title>本地优先的图表管线</title>
  <style id="text2html2png-theme" data-theme="editorial">
:root {
  --t-canvas: #f7f1e8;
  --t-canvas-image: none;
  --t-surface: #fffaf2;
  --t-surface-strong: #fffdf8;
  --t-surface-soft: #efe5d8;
  --t-text: #211916;
  --t-text-secondary: #5f4b40;
  --t-text-muted: #7d685b;
  --t-border: #d4c4b2;
  --t-rule: #ab9581;
  --t-head-rule-image: #5f4b40;
  --t-accent-1: #93472c;
  --t-accent-2: #253b56;
  --t-accent-3: #8f6811;
  --t-accent-4: #5d6b45;
  --t-accent-5: #7a3c4f;
  --t-accent-6: #37636a;
  --t-accent-7: #775438;
  --t-on-accent: #ffffff;
  --t-banner-bg: #253b56;
  --t-banner-text: #f7f1e8;
  --t-banner-accent: #e4bd62;
  --t-font-display: Georgia, "Songti SC", "STSong", serif;
  --t-font-body: Georgia, "Songti SC", "STSong", serif;
  --t-font-data: "Avenir Next", "Segoe UI", "PingFang SC", sans-serif;
  --t-title-size: 38px;
  --t-title-weight: 700;
  --t-title-tracking: -0.025em;
  --t-title-transform: none;
  --t-body-size: 14px;
  --t-body-weight: 500;
  --t-label-size: 10px;
  --t-label-weight: 700;
  --t-label-tracking: 0.2em;
  --t-label-transform: uppercase;
  --t-data-size: 30px;
  --t-data-weight: 700;
  --t-card-radius: 3px;
  --t-small-radius: 1px;
  --t-border-width: 1px;
  --t-border-style: solid;
  --t-card-shadow: none;
  --t-highlight-shadow: none;
  --t-backdrop: none;
  --t-leader-style: solid;
  --t-leader-width: 1px;
  --t-emoji-display: none;
  --t-svg-display: inline-flex;
}
  </style>
  <style id="text2html2png-chart" data-chart="architecture">
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--t-canvas);
  background-image: var(--t-canvas-image);
}

body {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  color: var(--t-text);
  font-family: var(--t-font-body);
  font-size: var(--t-body-size);
  font-weight: var(--t-body-weight);
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 1040px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 30px 32px 26px;
  overflow: hidden;
  background: var(--t-surface);
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-card-radius);
  box-shadow: var(--t-card-shadow);
  backdrop-filter: var(--t-backdrop);
  -webkit-backdrop-filter: var(--t-backdrop);
}

.head {
  text-align: center;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--t-accent-1);
  font-family: var(--t-font-data);
  font-size: var(--t-label-size);
  font-weight: var(--t-label-weight);
  letter-spacing: var(--t-label-tracking);
  text-transform: var(--t-label-transform);
}

h1 {
  margin: 0;
  color: var(--t-text);
  font-family: var(--t-font-display);
  font-size: var(--t-title-size);
  font-weight: var(--t-title-weight);
  letter-spacing: var(--t-title-tracking);
  line-height: 1.12;
  text-transform: var(--t-title-transform);
}

.lede {
  max-width: 700px;
  margin: 9px auto 0;
  color: var(--t-text-secondary);
  font-size: var(--t-body-size);
  line-height: 1.55;
}

.head-rule {
  height: 2px;
  margin-top: 16px;
  background: var(--t-head-rule-image);
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.metric {
  position: relative;
  min-height: 102px;
  padding: 14px 16px 13px;
  overflow: hidden;
  text-align: center;
  background: color-mix(in srgb, var(--metric-accent) 7%, var(--t-surface-strong));
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-small-radius);
  box-shadow: var(--t-card-shadow);
  backdrop-filter: var(--t-backdrop);
  -webkit-backdrop-filter: var(--t-backdrop);
}

.metric:first-child {
  box-shadow: var(--t-highlight-shadow);
}

.metric::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 4px;
  background: var(--metric-accent);
}

.metric-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.metric-emoji {
  display: var(--t-emoji-display);
  align-items: center;
  justify-content: center;
  font-size: 19px;
  line-height: 1;
}

/* Emoji slots render nothing until a fixture supplies a glyph, so an
   emoji-on theme never leaves an empty flex gap behind. */
[class$="-emoji"]:empty {
  display: none;
}

.metric-icon-svg {
  display: var(--t-svg-display);
  width: 19px;
  height: 19px;
}

.metric-icon-svg svg {
  display: block;
  width: 100%;
  height: 100%;
}

.metric-value {
  display: inline-block;
  color: var(--metric-accent);
  font-family: var(--t-font-data);
  font-size: var(--t-data-size);
  font-weight: var(--t-data-weight);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.metric-label {
  display: block;
  margin-top: 8px;
  color: var(--t-text);
  font-size: 12px;
  font-weight: 700;
}

.metric-detail {
  display: block;
  margin-top: 4px;
  color: var(--t-text-muted);
  font-size: 12px;
  line-height: 1.35;
}

html:lang(zh-CN) .eyebrow,
html:lang(zh-CN) .footer-label {
  letter-spacing: 0.08em;
  text-transform: none;
}

html:lang(zh-CN) h1 {
  letter-spacing: 0;
}

.footer {
  display: grid;
  grid-template-columns: 160px 1fr;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  color: var(--t-banner-text);
  background: var(--t-banner-bg);
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-small-radius);
  box-shadow: var(--t-card-shadow);
}

.footer-label {
  color: var(--t-banner-accent);
  font-family: var(--t-font-data);
  font-size: var(--t-label-size);
  font-weight: var(--t-label-weight);
  letter-spacing: var(--t-label-tracking);
  text-transform: var(--t-label-transform);
}

.footer p {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
}

.arch {
  display: flex;
  flex-direction: column;
}

.layer {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  align-items: center;
  padding: 7px 0;
}

.layer-tag {
  padding-right: 14px;
  color: var(--t-text-muted);
  font-family: var(--t-font-data);
  font-size: var(--t-label-size);
  font-weight: var(--t-label-weight);
  letter-spacing: var(--t-label-tracking);
  text-transform: var(--t-label-transform);
  text-align: right;
  line-height: 1.35;
}

.layer-nodes {
  display: flex;
  justify-content: center;
  gap: 10px;
  min-width: 0;
}

.node {
  flex: 1 1 0;
  min-width: 0;
  max-width: 250px;
  padding: 13px 14px 12px;
  text-align: center;
  background: color-mix(in srgb, var(--tone) 6%, var(--t-surface-strong));
  border: var(--t-border-width) var(--t-border-style) color-mix(in srgb, var(--tone) 60%, var(--t-border));
  border-radius: var(--t-small-radius);
  box-shadow: var(--t-card-shadow);
  backdrop-filter: var(--t-backdrop);
  -webkit-backdrop-filter: var(--t-backdrop);
}

.node-icons {
  display: flex;
  width: 24px;
  height: 24px;
  margin: 0 auto 6px;
  align-items: center;
  justify-content: center;
}

.node-icon-emoji {
  display: var(--t-emoji-display);
  align-items: center;
  justify-content: center;
  font-size: 20px;
  line-height: 1;
}

.node-icon-svg {
  display: var(--t-svg-display);
  width: 24px;
  height: 24px;
  color: var(--tone);
}

.node-icon-svg svg {
  display: block;
  width: 100%;
  height: 100%;
}

.node-name {
  margin: 0;
  color: var(--t-text);
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.3;
}

.node-desc {
  margin: 3px 0 0;
  color: var(--t-text-secondary);
  font-size: 12px;
  line-height: 1.4;
}

.conn-row {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
}

.conn-center {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 36px;
  color: var(--t-rule);
}

.conn-center svg {
  display: block;
  width: 18px;
  height: 30px;
}

.conn-label {
  color: var(--t-text-muted);
  font-family: var(--t-font-data);
  font-size: var(--t-label-size);
  font-weight: var(--t-label-weight);
  letter-spacing: var(--t-label-tracking);
}

html:lang(zh-CN) .layer-tag,
html:lang(zh-CN) .conn-label {
  letter-spacing: 0.08em;
  text-transform: none;
}
  </style>
</head>
