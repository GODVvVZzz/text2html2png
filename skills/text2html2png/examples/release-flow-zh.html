:root {

  --t-surface: #fffdf8;
  --t-surface-strong: #ffffff;
  --t-surface-soft: #f4ead9;
  --t-text: #2e2410;
  --t-text-secondary: #6a5a40;

  --t-rule: #c0a06a;

  --t-accent-1: #a8511c;
  --t-accent-2: #8a661a;
  --t-accent-3: #3a7a8c;
  --t-accent-4: #6a3a8c;
  --t-accent-5: #2c6e9e;
  --t-accent-6: #7a5c38;
  --t-accent-7: #3d7a4e;
  --t-on-accent: #ffffff;
  --t-banner-bg: linear-gradient(135deg, #3a2a10 0%, #5c3a18 100%);
  --t-banner-text: #f5e8cc;
  --t-banner-accent: #f0c060;
  --t-font-display: "Playfair Display", "Noto Serif SC", Georgia, "Songti SC", "STSong", serif;
  --t-font-body: "Noto Sans SC", "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

  --t-body-weight: 500;

  --t-small-radius: 8px;

  --t-border-style: solid;

  --t-highlight-shadow: 0 0 0 4px rgba(179, 88, 31, 0.08);

  --t-leader-style: dotted;

  <style id="text2html2png-chart" data-chart="flowchart">
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--t-canvas);
  background-image: var(--t-canvas-image);
}

body {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  color: var(--t-text);
  font-family: var(--t-font-body);
  font-size: var(--t-body-size);
  font-weight: var(--t-body-weight);
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 1040px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 30px 32px 26px;
  overflow: hidden;
  background: var(--t-surface);
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-card-radius);
  box-shadow: var(--t-card-shadow);
  backdrop-filter: var(--t-backdrop);
  -webkit-backdrop-filter: var(--t-backdrop);
}

.head {
  text-align: center;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--t-accent-1);
  font-family: var(--t-font-data);
  font-size: var(--t-label-size);
  font-weight: var(--t-label-weight);
  letter-spacing: var(--t-label-tracking);
  text-transform: var(--t-label-transform);
}

h1 {
  margin: 0;
  color: var(--t-text);
  font-family: var(--t-font-display);
  font-size: var(--t-title-size);
  font-weight: var(--t-title-weight);
  letter-spacing: var(--t-title-tracking);
  line-height: 1.12;
  text-transform: var(--t-title-transform);
}

.lede {
  max-width: 700px;
  margin: 9px auto 0;
  color: var(--t-text-secondary);
  font-size: var(--t-body-size);
  font-style: var(--t-lede-style);
  line-height: 1.55;
}

.head-rule {
  height: 2px;
  margin-top: 16px;
  background: var(--t-head-rule-image);
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.metric {
  position: relative;
  min-height: 102px;
  padding: 14px 16px 13px;
  overflow: hidden;
  text-align: center;
  background: color-mix(in srgb, var(--metric-accent) 7%, var(--t-surface-strong));
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-small-radius);
  box-shadow: var(--t-card-shadow);
  backdrop-filter: var(--t-backdrop);
  -webkit-backdrop-filter: var(--t-backdrop);
}

.metric:first-child {
  box-shadow: var(--t-highlight-shadow);
}

.metric::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 4px;
  background: var(--metric-accent);
}

.metric-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.metric-emoji {
  display: var(--t-emoji-display);
  align-items: center;
  justify-content: center;
  font-size: 19px;
  line-height: 1;
}

/* Emoji slots render nothing until a fixture supplies a glyph, so an
   emoji-on theme never leaves an empty flex gap behind. */
[class$="-emoji"]:empty {
  display: none;
}

.metric-icon-svg {
  display: var(--t-svg-display);
  width: 19px;
  height: 19px;
}

.metric-icon-svg svg {
  display: block;
  width: 100%;
  height: 100%;
}

.metric-value {
  display: inline-block;
  color: var(--metric-accent);
  font-family: var(--t-font-data);
  font-size: var(--t-data-size);
  font-weight: var(--t-data-weight);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.metric-label {
  display: block;
  margin-top: 8px;
  color: var(--t-text);
  font-size: 12px;
  font-weight: 700;
}

.metric-detail {
  display: block;
  margin-top: 4px;
  color: var(--t-text-muted);
  font-size: 12px;
  line-height: 1.35;
}

html:lang(zh-CN) .eyebrow,
html:lang(zh-CN) .footer-label {
  letter-spacing: 0.08em;
  text-transform: none;
}

html:lang(zh-CN) h1 {
  letter-spacing: 0;
}

.footer {
  display: grid;
  grid-template-columns: 160px 1fr;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  color: var(--t-banner-text);
  background: var(--t-banner-bg);
  border: var(--t-border-width) var(--t-border-style) var(--t-border);
  border-radius: var(--t-small-radius);
  box-shadow: var(--t-card-shadow);
}

.footer-label {
  color: var(--t-banner-accent);
  font-family: var(--t-font-data);
  font-size: var(--t-label-size);
  font-weight: var(--t-label-weight);
  letter-spacing: var(--t-label-tracking);
  text-transform: var(--t-label-transform);
}

.footer p {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
}
