name: Release skill package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Verify version and package the declared skill files
        run: node scripts/package-release.mjs "${GITHUB_REF_NAME}"
      - name: Build archive and checksum
        run: |
          cd dist/package
          zip -qr ../text2html2png.skill text2html2png
          cd ..
          sha256sum text2html2png.skill > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/text2html2png.skill dist/SHA256SUMS
          --notes-file "docs/RELEASE-${GITHUB_REF_NAME}.md"
          --title "text2html2png ${GITHUB_REF_NAME}"
