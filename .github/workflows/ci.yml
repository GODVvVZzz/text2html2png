name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-sources:
    name: Public dependency sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Reject non-public tarball URLs before dependency installation
        run: node skills/text2html2png/scripts/validate-lockfile.mjs

  check:
    needs: dependency-sources
    name: Node ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/text2html2png
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: skills/text2html2png/package-lock.json

      # --no-audit: the dedicated audit step below already covers
      # vulnerabilities, so the install does not need the advisory endpoint.
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # Keep the real error around if the install ever fails.
      - name: Dump npm debug logs on failure
        if: failure()
        shell: bash
        run: |
          cache="$(npm config get cache)"
          for f in "$cache"/_logs/*.log; do
            echo "===== $f ====="
            tail -n 200 "$f"
          done

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run checks and Chrome smoke test
        run: npm run check

      - name: Inspect package allowlist
        run: npm pack --dry-run

      - name: Exercise public JSON renderer
        run: node scripts/render.mjs --input examples/release-flow.diagram.json --html public-cli-smoke.html --png public-cli-smoke.png --audit --json

      - name: Upload public renderer preview
        uses: actions/upload-artifact@v4
        with:
          name: renderer-preview-${{ matrix.os }}
          path: |
            skills/text2html2png/public-cli-smoke.html
            skills/text2html2png/public-cli-smoke.png

  first-install:
    needs: dependency-sources
    name: First install ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install selected fonts and render in an isolated skill copy
        run: node scripts/smoke-install.mjs --out install-smoke.json
      - name: Upload measured installation result
        uses: actions/upload-artifact@v4
        with:
          name: first-install-${{ matrix.os }}
          path: install-smoke.json

  plugin-manifest:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Validate required manifest fields
        run: >-
          node -e "const p=require('./.codex-plugin/plugin.json');
          for (const k of ['name','version','description','skills']) if (!p[k]) throw new Error('missing '+k);
          if (p.name !== 'text2html2png' || p.skills !== './skills/') throw new Error('unexpected manifest values');"

      - name: Check local documentation links
        run: node scripts/check-links.mjs

  theme-orthogonality:
    needs: dependency-sources
    name: Theme / chart orthogonality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: skills/text2html2png/package-lock.json

      # The experiment lives outside the shippable skill package, so it is
      # verified here rather than from the skill's own scripts.
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        working-directory: skills/text2html2png

      - name: Dump npm debug logs on failure
        if: failure()
        shell: bash
        run: |
          cache="$(npm config get cache)"
          for f in "$cache"/_logs/*.log; do
            echo "===== $f ====="
            tail -n 200 "$f"
          done

      - name: Validate source orthogonality
        run: node experiments/theme-decoupling/scripts/validate-orthogonality.mjs

      - name: Run orthogonality tests
        run: node --test experiments/theme-decoupling/tests/*.test.mjs

  generated-docs:
    name: Generated gallery is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      # Rebuilds both locales and copies committed downloadable artifacts;
      # no Chrome or installed dependencies are needed here.
      - name: Regenerate gallery text output
        run: node scripts/build-gallery.mjs --skip-render

      - name: Fail if generated files are out of date
        run: |
          if ! git diff --exit-code -- docs skills/text2html2png/examples/prompts.md || [ -n "$(git ls-files --others --exclude-standard -- docs)" ]; then
            echo "::error::Run 'node scripts/build-gallery.mjs --skip-render' and commit the result."
            exit 1
          fi
