name: Rendering bug
description: Report a reproducible problem using synthetic or public content.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove private data, internal URLs, and secrets before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: chart
    attributes:
      label: Chart type
      options: [flowchart, comparison, timeline, architecture, dashboard, gantt, org-chart, funnel, unknown]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include the prompt, command, and minimal HTML when relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, private identifiers, and company/customer data.
          required: true
